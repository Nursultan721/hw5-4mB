{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <header class="header">
      <div class="container header__inner">
        <a href="{% url 'home' %}" class="logo">Ne<b>xo</b></a>

        <button class="burger" type="button" aria-label="Открыть меню">
          ☰
        </button>

        <nav class="nav">
          <a href="{% url 'home' %}" class="nav__link is-active">Главная</a>
          <a href="#how" class="nav__link">Как это работает</a>
          <a href="#features" class="nav__link">Возможности</a>

          <span class="nav__divider"></span>

          <a
            href="{% url 'login' %}"
            class="nav__link hidden"
            data-auth="guest"
            >Вход</a
          >
          <a
            href="{% url 'register' %}"
            class="btn btn--solid btn--sm hidden"
            data-auth="guest"
            >Регистрация</a
          >

          <a
            href="{% url 'profile' %}"
            class="nav__link hidden"
            data-auth="user"
          >
            <span data-user-name>Профиль</span>
          </a>
          <button
            type="button"
            class="btn btn--outline btn--sm hidden"
            data-auth="user"
            data-logout="/"
          >
            Выйти
          </button>
        </nav>
      </div>
    </header>
  </body>
</html>
